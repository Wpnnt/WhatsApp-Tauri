[package]
name = "whatsapp-tauri"
version = "0.3.3"
description = "A Tauri App"
authors = ["Wpnnt"]
edition = "2021"


[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Perfil de release para distribución (iteración perf/release-profile).
# Antes de este bloque el binario se compilaba con los defaults de Cargo:
# opt-level=3, lto=false, codegen-units=16, panic=unwind, strip=none.
[profile.release]
opt-level = 3        # variante "z" medida y descartada: t_window +64%; ver perf-log.md
lto = "fat"          # eliminación de código muerto entre crates (regex/tokio/tauri)
codegen-units = 1    # más optimización global a costa de tiempo de build
panic = "abort"      # sin tablas de desenrollado
strip = "symbols"    # sin símbolos en el binario distribuido
